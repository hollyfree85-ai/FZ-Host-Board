name: Daily operational reset
on:
  schedule:
    - cron: '0 9,10 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: daily-reset
  cancel-in-progress: false
jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/daily-reset.cjs
