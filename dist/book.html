<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book a Table | The Juicy Seafood &amp; Bar</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f5f2;color:#24201d;font:16px system-ui}main{max-width:38rem;margin:auto;padding:2rem 1rem}form{background:white;border-radius:16px;padding:1.25rem;display:grid;gap:1rem}label{display:grid;gap:.35rem;font-weight:600}input,select,button{min-width:0;width:100%;min-height:46px;font:inherit;padding:.55rem;border:1px solid #867a72;border-radius:7px}button{background:#922c20;color:white;font-weight:700}button:disabled{opacity:.55}label.check{display:flex;align-items:center}input[type=checkbox]{width:22px;min-height:22px} [hidden]{display:none!important}
</style><main><p>The Juicy Seafood &amp; Bar · Huntsville</p><h1>Book a Table</h1><p>Reservations for parties of 6 or more. All times are Huntsville local time.</p><p id="status" role="status">Online booking is not available yet. Please contact the restaurant to reserve.</p><form id="booking" hidden><label>Name<input name="name" autocomplete="name" required maxlength="100"></label><label>Guests<input name="people" type="number" min="6" max="120" value="6" required></label><label>Date<input name="date" type="date" required></label><label>Time<input name="time" type="time" required></label><label>Reminder preference<select name="channel"><option value="email">Email</option><option value="sms">Text message</option></select></label><label id="email">Email<input type="email" name="email" autocomplete="email" maxlength="254" required></label><label id="phone" hidden>Mobile phone<input type="tel" name="phone" autocomplete="tel" maxlength="30" disabled></label><label class="check"><input type="checkbox" name="consent" required>I agree to receive confirmation and reminders for this reservation.</label><button>Confirm reservation</button></form></main><script src="book.js" defer></script></html>
